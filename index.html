---
layout: default
---

<div class="minimal-hero">
  <div class="brain-container">
    <img class="brain-art" src="/images/brain.png" alt="" aria-hidden="true" />
    <h1 class="minimal-name">{{ site.name }}</h1>
  </div>
</div>

<script>
  window.__floatingWords = [
    {% for w in site.data.floating-words %}
    { text: {{ w.text | jsonify }}, weight: {{ w.weight | default: 3 }} }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
</script>
<script src="{{ site.baseurl }}/js/floating-words.js"></script>
